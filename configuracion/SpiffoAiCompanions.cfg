## Characters per second estimated for reading. Lower means longer on screen.
# Setting type: Single
# Default value: 12
# Acceptable value range: From 4 to 40
ReadingSpeed = 12

## Minimum time a reply stays on screen.
# Setting type: Single
# Default value: 7
# Acceptable value range: From 2 to 30
MinReadingSeconds = 7

## Maximum time a reply stays on screen.
# Setting type: Single
# Default value: 30
# Acceptable value range: From 5 to 120
MaxReadingSeconds = 30

## Maximum distance in meters to talk to a companion. Keep it at least as far as they roam to work: beyond this you cannot talk to them and they make no comments.
# Setting type: Single
# Default value: 80
# Acceptable value range: From 2 to 100
TalkRange = 80

## Maximum distance in meters at which a companion hears you when you shout with /s in chat. Beyond this, the game usually has their zone unloaded.
# Setting type: Single
# Default value: 120
# Acceptable value range: From 20 to 300
ShoutRange = 120

## Minimum seconds between messages, to avoid overspending.
# Setting type: Single
# Default value: 2
# Acceptable value range: From 0 to 60
Cooldown = 2

## Logs the conversation in the chat window and shows it briefly. Press Enter to read it again.
# Setting type: Boolean
# Default value: true
ShowInChat = true

[IA]

## AI service: Player2, Ollama, LMStudio, or Custom.
# Setting type: AiProvider
# Default value: Player2
# Acceptable values: Player2, Ollama, LMStudio, Custom
Provider = Player2

## For Custom only: OpenAI-compatible URL, up to and including /v1. Example: https://openrouter.ai/api/v1
# Setting type: String
# Default value: 
BaseUrl = 

## Model to use. Player2 picks it for you. Required for Ollama (e.g., llama3.2) and most Custom services.
# Setting type: String
# Default value: 
Model = 

## Service API key, if needed. Stored unencrypted in this file: do not share it.
# Setting type: String
# Default value: 
ApiKey = 

## Higher means more varied replies.
# Setting type: Single
# Default value: 0.8
# Acceptable value range: From 0 to 2
Temperature = 0.8

## Token limit per reply. 0 = unlimited. A low value may leave the reply empty.
# Setting type: Int32
# Default value: 0
MaxTokens = 0

## Seconds to wait before giving up.
# Setting type: Int32
# Default value: 30
# Acceptable value range: From 5 to 180
TimeoutSeconds = 30

[Memoria]

## Saves conversations across sessions, unencrypted, in the mod's config folder.
# Setting type: Boolean
# Default value: true
Enabled = true

## Summarizes older messages with the AI to remember them long-term. Each summary is a request and uses credits.
# Setting type: Boolean
# Default value: true
Summarize = true

[Personaje]

## Mod interface, menu, and AI prompt language: Auto (follows Valheim's language: English, Español Latinoamérica, or Español España), English, or Spanish. Can also be changed in-game with /language or in the Character Editor.
# Setting type: ModLanguage
# Default value: Auto
# Acceptable values: English, Spanish, Auto
Language = Auto

## Language in which the companion replies. Leave as auto/English/español to follow the mod language, or set any custom language.
# Setting type: String
# Default value: auto
ReplyLanguage = auto

## Shared personality for companions without custom instructions. Empty: each one gets a distinct profile.
# Setting type: String
# Default value: 
Personality = 

## Built-in Offline Companions lines. Avisos (Warnings): only events and problems ("I don't have an axe"), without idle chatter or "as you command" that would talk over the character. Todas (All): like the original mod. Ninguna (None): total silence.
# Setting type: RebornSpeechMode
# Default value: Avisos
# Acceptable values: Todas, Avisos, Ninguna
RebornSpeech = Avisos

## Maximum length of each text chunk above their head. Longer replies are shown in parts above their head, and in full in chat.
# Setting type: Int32
# Default value: 220
# Acceptable value range: From 40 to 600
MaxReplyChars = 220

## Recent messages sent in full to the AI on each request.
# Setting type: Int32
# Default value: 12
# Acceptable value range: From 0 to 64
HistoryMessages = 12

[Reacciones]

## Warns when hungry without food, gear is very worn out, or backpack is full, at most once every 10 minutes per need.
# Setting type: Boolean
# Default value: true
Needs = true

## The companion comments on their own about what happens. Each comment is an AI request and uses credits.
# Setting type: Boolean
# Default value: true
Enabled = true

## Minimum seconds since they last spoke, except when defeating a boss.
# Setting type: Single
# Default value: 180
# Acceptable value range: From 30 to 3600
Cooldown = 180

## Maximum comments per hour of gameplay.
# Setting type: Int32
# Default value: 10
# Acceptable value range: From 1 to 60
MaxPerHour = 10

## Comments when defeating a boss.
# Setting type: Boolean
# Default value: true
BossDefeated = true

## Comments when entering a biome for the first time in the session.
# Setting type: Boolean
# Default value: true
NewBiome = true

## Comments when you die and respawn, if nearby.
# Setting type: Boolean
# Default value: true
PlayerDied = true

## Comments when returning after dying.
# Setting type: Boolean
# Default value: true
CompanionReturned = true

## Comments when low on health.
# Setting type: Boolean
# Default value: true
LowHealth = true

## Comments when an enemy raid starts and ends where you are.
# Setting type: Boolean
# Default value: true
Raid = true

## Comments when finishing a task like "get 10 stones". The on-screen notice always appears.
# Setting type: Boolean
# Default value: true
GoalFinished = true

[Voz]

## Allows talking to the companion with your microphone. Only listens while you hold VoiceKey. Requires the Player2 app (where microphone and language are selected) and uses credits.
# Setting type: Boolean
# Default value: true
Enabled = true

