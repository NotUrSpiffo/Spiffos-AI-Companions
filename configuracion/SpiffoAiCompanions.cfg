## Settings file was created by plugin Spiffo's Valheim AI Companions v0.25.8
## Plugin GUID: SpiffoAiCompanions

[Autonomia]

## Normal: only does what you ask. Autonomo: also talks, proposes, and does helpful tasks on their own, and each initiative uses credits. Toggle in-game with /autonomy or /autonomia.
# Setting type: AutonomyMode
# Default value: Normal
# Acceptable values: Normal, Autonomo
Mode = Normal

## In autonomous mode, minimum seconds since they last spoke before taking the initiative. If busy, they can only talk and wait three times as long.
# Setting type: Single
# Default value: 75
# Acceptable value range: From 20 to 3600
IntervalSeconds = 75

## In autonomous mode, maximum initiatives per hour, aside from automatic comments. An initiative with a task uses two or more requests.
# Setting type: Int32
# Default value: 30
# Acceptable value range: From 1 to 120
MaxPerHour = 30

## In autonomous mode, avoids enemies that are too strong for your gear and warns you. Still fights if you or they are attacked up close, or if you order it. Bosses do not count.
# Setting type: Boolean
# Default value: true
AvoidStrongEnemies = true

## Threshold at which an enemy is considered too strong. Lower means more cautious. The log shows each enemy's ratio in [Threat] lines.
# Setting type: Single
# Default value: 1.5
# Acceptable value range: From 0.5 to 10
StrongEnemyRatio = 1.5

