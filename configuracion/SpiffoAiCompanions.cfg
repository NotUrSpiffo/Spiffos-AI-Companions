# Setting type: Boolean
# Default value: true
TalkInGameChat = true

## Shows every order actually applied or rejected in chat, aside from what the companion says.
# Setting type: Boolean
# Default value: true
ShowOrdersInChat = true

## Shows a key reminder when entering a world.
